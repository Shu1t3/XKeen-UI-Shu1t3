name: Build Rust binaries
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['backend/**', 'frontend/**', 'scripts/**', 'rust-toolchain.toml', '.github/workflows/build-rust.yml', '.github/scripts/**']
  pull_request:
    paths: ['backend/**', 'frontend/**', 'scripts/**', 'rust-toolchain.toml', '.github/workflows/build-rust.yml', '.github/scripts/**']
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.0)"
        required: true
        type: string
      channel:
        description: "Release channel (beta or stable)"
        required: true
        type: choice
        options:
          - beta
          - stable
        default: beta
      publish:
        description: "Publish release after all checks and builds"
        type: boolean
        default: true
permissions:
  contents: read
env:
  RUST_STABLE: '1.99.0'
  RUST_NIGHTLY: 'nightly-2026-10-06'
  CROSS_REV: '74e99b2223de06166f8cdcc1af7f1308ec52baf4'
  XKEEN_UI_VERSION: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'v0.0.0' }}
jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Require release notes
        if: (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "Invalid release version"; exit 1; }
          notes="docs/releases/$RELEASE_VERSION.md"
          test -s "$notes" || { echo "Missing release notes: $notes"; exit 1; }
          grep -q '^## Исправления$' "$notes" || { echo "Release notes must describe fixes"; exit 1; }
          grep -q '^- ' "$notes" || { echo "Release notes must contain changes"; exit 1; }
      - name: Test installer transactions
        run: |
          sh scripts/test-release-source.sh
          sh scripts/test-installer-transaction.sh
          sh scripts/test-self-update.sh
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.7.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - name: Build and test frontend
        working-directory: frontend
        run: bun install --frozen-lockfile && bunx eslint . --max-warnings 0 && bun test tests && bun run build
      - name: Install Rust for checks
        run: rustup toolchain install "$RUST_STABLE" --profile minimal -c clippy
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: backend
          key: tests-locked
      - name: Check backend
        working-directory: backend
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --features local-dev -- -D warnings
          cargo test --locked
          cargo test --locked --features local-dev
          git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  build:
    needs: frontend
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            name: arm64-v8a
            channel: stable
          - target: mipsel-unknown-linux-musl
            name: mips32le
            channel: nightly
            rustflags: "-C target-feature=+crt-static -L /usr/local/mipsel-linux-muslsf/lib -L /usr/local/lib/gcc/mipsel-linux-muslsf/9.2.0"
          - target: mips-unknown-linux-musl
            name: mips32
            channel: nightly
            rustflags: "-C target-feature=+crt-static -L /usr/local/mips-linux-muslsf/lib -L /usr/local/lib/gcc/mips-linux-muslsf/9.2.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Install pinned Rust
        env:
          CHANNEL: ${{ matrix.channel }}
        run: |
          toolchain="$RUST_STABLE"
          if [ "$CHANNEL" = nightly ]; then toolchain="$RUST_NIGHTLY"; fi
          rustup toolchain install "$RUST_STABLE" --profile minimal
          rustup toolchain install "$toolchain" --profile minimal -c rust-src
          echo "BUILD_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: backend
          key: locked-${{ matrix.target }}
      - name: Install pinned cross in isolated root
        run: |
          cargo +"$RUST_STABLE" install --locked --git https://github.com/cross-rs/cross --rev "$CROSS_REV" --root "$RUNNER_TEMP/pinned-cross" cross
          echo "$RUNNER_TEMP/pinned-cross/bin" >> "$GITHUB_PATH"
      - name: Check locked metadata
        working-directory: backend
        run: cargo +"$BUILD_TOOLCHAIN" metadata --locked --format-version 1 > /dev/null
      - name: Inject frontend dist for cross
        working-directory: backend
        run: |
          cp -r ../frontend/dist ./dist
          sed -i 's|\.\./frontend/dist|./dist|' src/frontend_embedder.rs
      - name: Build and smoke-test router binary
        working-directory: backend
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          BUILD_TARGET: ${{ matrix.target }}
          ASSET_NAME: ${{ matrix.name }}
        run: |
          cross +"$BUILD_TOOLCHAIN" build --locked --release --target "$BUILD_TARGET"
          timeout 60 cross +"$BUILD_TOOLCHAIN" run --locked --release --target "$BUILD_TARGET" -- --version | tee ../version-output.txt
          grep -F "$XKEEN_UI_VERSION" ../version-output.txt
          git diff --exit-code -- Cargo.lock
          cp "target/$BUILD_TARGET/release/xkeen-ui" "../xkeen-ui-$ASSET_NAME"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: xkeen-ui-${{ matrix.name }}
          path: xkeen-ui-${{ matrix.name }}
          if-no-files-found: error

  release:
    if: (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Determine release metadata
        id: meta
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
            if [ "$INPUT_CHANNEL" = "stable" ]; then
              prerelease="false"
              make_latest="true"
            else
              prerelease="true"
              make_latest="false"
            fi
          else
            version="$REF_NAME"
            case "$version" in
              *-*)
                prerelease="true"
                make_latest="false"
                ;;
              *)
                prerelease="false"
                make_latest="true"
                ;;
            esac
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "make_latest=$make_latest" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: xkeen-ui-*
          path: artifacts
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: docs/releases/${{ steps.meta.outputs.version }}.md
          fail_on_unmatched_files: true
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.meta.outputs.make_latest }}
          files: artifacts/xkeen-ui-*/*
      - name: Verify published GitHub digests
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.version }}
          HTTPS_PROXY: ''
          HTTP_PROXY: ''
          ALL_PROXY: ''
        run: python3 .github/scripts/verify-release-digests.py
